# Builds tinycols for the Asciiverse catalog: one archive per target,
# tinycols-<target>.tar.gz (.zip on Windows), plus SHA256SUMS, attached to
# a GitHub release (hub/catalog/SCHEMA.md, release.source = "github").
# Runs on our tags (*-av.*), or by hand for an existing tag.
#
# Built by asciiverse/package.sh with the changes in PATCHES.md. Linux builds
# run in Alpine and link ncurses statically, so the binaries carry the
# -musl triple av looks for first and need nothing on the player's
# machine. macOS links the system ncurses. Windows is cross-built with
# MinGW against PDCurses (wincon, with the ncurses mouse calls).

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PDCURSES_VERSION: "3.9"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static zip &&
            LDFLAGS="-static -s" CURSES_LIBS="-lncursesw" asciiverse/package.sh ${{ matrix.target }}'
          file tinycols

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" \
            CURSES_LIBS="-lncurses" asciiverse/package.sh ${{ matrix.target }}
          strip tinycols
          file tinycols

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build PDCurses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
          curl -sL "https://github.com/wmcbrine/PDCurses/archive/refs/tags/$PDCURSES_VERSION.tar.gz" | tar xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION/wincon" CC=$CROSS-gcc AR=$CROSS-ar pdcurses.a

      - name: Build and package
        run: |
          PDC="$RUNNER_TEMP/PDCurses-$PDCURSES_VERSION"
          CC=$CROSS-gcc CPPFLAGS="-I$PDC -DPDC_NCMOUSE" CURSES_LIBS="$PDC/wincon/pdcurses.a" \
            LDFLAGS="-static -s" asciiverse/package.sh $TARGET
          file tinycols.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "tinycols $TAG" \
                 --notes "tinycols $TAG, Rigel Di Scala's jewel-matching game, with the changes in PATCHES.md, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
